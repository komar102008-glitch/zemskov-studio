<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Как устроена работа над сайтом в Zemskov Studio.">
  <title>Как устроена работа — Zemskov Studio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root{--paper:#d8d8d4;--ink:#171817;--muted:#757671;--line:#aaa9a3;--orange:#e9a77d;--deep:#c87d51;--white:#f1f0ec;--mono:'DM Mono',monospace;--sans:'Manrope',Arial,sans-serif;--pad:clamp(20px,5vw,78px)}
    *{box-sizing:border-box}html{background:var(--paper);scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow-x:hidden}a{color:inherit;text-decoration:none}.shell{width:min(1440px,100%);padding-inline:var(--pad);margin:auto}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:12px}.brand{font-size:16px;font-weight:800;letter-spacing:-.06em}.brand span{color:var(--deep)}.back{font:10px var(--mono);text-transform:uppercase;border-bottom:1px solid var(--ink);padding:8px 0}.kicker,.meta,.eyebrow{font:10px var(--mono);letter-spacing:.11em;text-transform:uppercase}.kicker{color:var(--deep)}.hero{padding-top:clamp(55px,10vh,130px);padding-bottom:clamp(70px,12vh,145px);position:relative}.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(230px,.75fr);gap:40px;align-items:end}.title{font-size:clamp(54px,10vw,138px);font-weight:800;line-height:.84;letter-spacing:-.095em;max-width:1000px;margin:28px 0 0;position:relative;text-shadow:1px 1px 0 #efba98,3px 3px 0 var(--orange),5px 6px 0 #17181720}.summary{max-width:370px;justify-self:end;font-size:clamp(16px,1.8vw,21px);line-height:1.6;margin:0 0 8px;color:#41423e}.hero-index{position:absolute;right:var(--pad);bottom:25px;font:9px var(--mono);color:var(--muted)}.content{border-top:1px solid var(--ink);padding:clamp(45px,7vw,88px) 0 clamp(90px,12vw,155px);display:grid;grid-template-columns:.55fr 1.45fr;gap:var(--pad)}.index{font:11px var(--mono);color:var(--deep)}.details h2{font-size:clamp(30px,4vw,54px);line-height:.98;letter-spacing:-.065em;margin:0 0 25px;max-width:720px}.details>p{font-size:15px;line-height:1.85;color:#4e4f49;max-width:690px;margin:0}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:52px}.fact{background:var(--white);padding:22px;min-height:155px}.fact span{font:9px var(--mono);color:var(--deep);text-transform:uppercase}.fact h3{font-size:19px;letter-spacing:-.04em;margin:24px 0 8px}.fact p{font-size:12px;line-height:1.7;color:#5d5e58;margin:0}.nav-bottom{border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:25px;padding:24px 0 34px;font:10px var(--mono);text-transform:uppercase}.nav-bottom a{transition:color .2s}.nav-bottom a:hover{color:var(--deep)}.footer{border-top:1px solid var(--line);padding:20px 0 30px;display:flex;justify-content:space-between;align-items:center;font:9px var(--mono);color:var(--muted)}
    @view-transition{navigation:auto}::view-transition-old(root){animation:page-out .28s ease both}::view-transition-new(root){animation:page-in .5s cubic-bezier(.2,.8,.2,1) both}@keyframes page-out{to{opacity:0;transform:scale(.99);filter:blur(4px)}}@keyframes page-in{from{opacity:0;transform:translateY(16px) scale(.99);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
    @media(max-width:700px){.top{height:65px}.hero{padding-top:70px;padding-bottom:80px}.hero-grid{grid-template-columns:1fr;gap:28px}.title{font-size:clamp(50px,13vw,88px);margin-top:24px}.summary{justify-self:start;max-width:500px}.content{grid-template-columns:1fr;gap:20px;padding-top:38px}.details h2{font-size:clamp(30px,8vw,44px)}.details>p{font-size:14px}.facts{margin-top:35px}.fact{padding:17px;min-height:145px}.fact h3{font-size:16px;margin-top:20px}.fact p{font-size:11px}.nav-bottom{font-size:9px}.footer{flex-wrap:wrap;gap:12px}.footer>span{width:100%;order:3}}
    @media(max-width:420px){.facts{grid-template-columns:1fr}.fact{min-height:auto}.fact h3{margin:16px 0 7px}.nav-bottom{gap:10px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <header class="shell top"><a class="brand" href="index.html#top">Zemskov <span>Studio</span></a><a class="back" href="index.html#included"> Ко всем пунктам</a></header>
  <main class="shell">
    <section class="hero"><span class="kicker" id="kicker">04 / ЧТО ВХОДИТ В РАБОТУ</span><div class="hero-grid"><h1 class="title" id="title">Внимание<br>к целому.</h1><p class="summary" id="summary"></p></div><span class="hero-index" id="hero-index">01 — 05</span></section>
    <section class="content"><div class="index" id="index-label">01 / ЭТАП</div><div class="details"><h2 id="heading"></h2><p id="body-copy"></p><div class="facts"><article class="fact"><span>Что делаю</span><h3 id="fact-one-title"></h3><p id="fact-one-copy"></p></article><article class="fact"><span>Что получается</span><h3 id="fact-two-title"></h3><p id="fact-two-copy"></p></article></div></div></section>
    <nav class="nav-bottom" aria-label="Другие пункты"><a id="previous" href="index.html#included"> Назад</a><a id="next" href="index.html#included">Следующий пункт </a></nav>
  </main>
  <footer class="shell footer"><a class="brand" href="index.html#top">Zemskov <span>Studio</span></a><span>СМЫСЛ · СТРУКТУРА · ДИЗАЙН · ЗАПУСК</span><a href="index.html#contact">Обсудить проект </a></footer>
  <script>
    const items=[
      {id:'brief',label:'Погружение в задачу и аудиторию',summary:'Сначала разбираюсь, что именно нужно объяснить человеку и почему ему это важно.',heading:'Находим главное до того, как выбирать форму.',body:'Обсуждаем продукт, цели проекта, аудиторию и ограничения. Смотрю на материалы и задаю вопросы, которые помогают отличить ключевое от второстепенного. Это становится опорой для структуры и визуального направления.',oneTitle:'Контекст проекта',oneCopy:'Цели, продукт, аудитория, конкуренты и исходные материалы.',twoTitle:'Чёткая задача',twoCopy:'Зафиксированное понимание того, что сайт должен донести и к какому действию вести.'},
      {id:'structure',label:'Структура и прототип страниц',summary:'Выстраиваю содержание так, чтобы посетителю было ясно, куда смотреть и что делать дальше.',heading:'Сначала маршрут. Потом оформление.',body:'Определяю, какие страницы и блоки нужны, в каком порядке раскрывать информацию и где посетитель принимает решение. Черновая схема позволяет согласовать логику до детальной работы над визуалом.',oneTitle:'Порядок информации',oneCopy:'Сценарий страниц и последовательность смысловых блоков.',twoTitle:'Основа для дизайна',twoCopy:'Согласованная схема, на которую можно уверенно опирать визуальную концепцию.'},
      {id:'design',label:'Авторский визуальный дизайн',summary:'Перевожу характер проекта в типографику, цвет, композицию и детали интерфейса.',heading:'Визуальный язык должен быть своим и понятным.',body:'Подбираю визуальное направление исходя из задачи, а не готового шаблона. Собираю интерфейсные элементы и страницы в цельную систему, уделяя внимание и выразительности, и удобству чтения.',oneTitle:'Визуальная концепция',oneCopy:'Типографика, цвет, композиция, графические элементы и общее настроение.',twoTitle:'Дизайн страниц',twoCopy:'Цельный интерфейс с понятными акцентами и согласованной системой деталей.'},
      {id:'mobile',label:'Адаптация для мобильных экранов',summary:'Продумываю, как структура и интерфейс работают на небольшом экране, а не просто уменьшаю макет.',heading:'Удобство сохраняется на любом размере экрана.',body:'Перестраиваю композицию, размеры текста, отступы и поведение элементов под телефон. Проверяю, чтобы контент читался, кнопки было удобно нажимать, а важные блоки не терялись.',oneTitle:'Отдельная компоновка',oneCopy:'Порядок и размеры элементов под узкий экран с учётом сценария просмотра.',twoTitle:'Проверка адаптива',twoCopy:'Понятная навигация, читаемый текст и аккуратное отображение без горизонтальной прокрутки.'},
      {id:'launch',label:'Сборка, проверка и запуск',summary:'Собираю готовые страницы, проверяю основные сценарии и передаю проект после согласования.',heading:'Последние детали — часть общего впечатления.',body:'Переношу согласованный дизайн в сайт, проверяю ссылки, формы и отображение на разных устройствах. После финальной сверки готовлю проект к публикации и передаю доступы.',oneTitle:'Сборка и проверка',oneCopy:'Страницы, ссылки и основные состояния интерфейса проверены перед публикацией.',twoTitle:'Готовый проект',twoCopy:'Опубликованный сайт и переданные владельцу доступы.'}
    ];
    const params=new URLSearchParams(location.search);let current=items.findIndex(item=>item.id===params.get('topic'));if(current<0)current=0;const item=items[current];
    document.title=`${item.label} — Zemskov Studio`;document.querySelector('#kicker').textContent=`04 / ЧТО ВХОДИТ В РАБОТУ`;document.querySelector('#title').innerHTML=item.label.replace(' и ',' и<br>');document.querySelector('#summary').textContent=item.summary;document.querySelector('#index-label').textContent=`${String(current+1).padStart(2,'0')} / ЭТАП`;document.querySelector('#heading').textContent=item.heading;document.querySelector('#body-copy').textContent=item.body;document.querySelector('#fact-one-title').textContent=item.oneTitle;document.querySelector('#fact-one-copy').textContent=item.oneCopy;document.querySelector('#fact-two-title').textContent=item.twoTitle;document.querySelector('#fact-two-copy').textContent=item.twoCopy;document.querySelector('#hero-index').textContent=`${String(current+1).padStart(2,'0')} — 05`;
    const prev=items[(current+items.length-1)%items.length],next=items[(current+1)%items.length];document.querySelector('#previous').href=`detail.html?topic=${prev.id}`;document.querySelector('#previous').textContent=prev.label;document.querySelector('#next').href=`detail.html?topic=${next.id}`;document.querySelector('#next').textContent=next.label;
  </script>
